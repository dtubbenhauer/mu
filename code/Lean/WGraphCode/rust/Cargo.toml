[package]
name = "wgraphgen"
version = "0.1.0"
edition = "2024"
authors = ['Tom Goertzen', 'Keeley Hoek']

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
ctrlc = "3.5.2"
indicatif = "0.18.4"
libc = "0.2.177"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }

[[bin]]
name = "wgraphgen"
path = "src/main.rs"
